name: 构建并发布桌面应用

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-release:
    name: 准备草稿 Release
    runs-on: ubuntu-latest
    steps:
      - name: 创建草稿 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"
          || gh release create "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --title "OpenCode Go Dashboard ${GITHUB_REF_NAME}"
          --generate-notes
          --draft

  build:
    name: 构建 ${{ matrix.name }}
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: package:win
            artifact: release/*.exe
            bundle: windows
          - name: Linux x64
            os: ubuntu-latest
            command: package:linux
            artifact: release/*.AppImage
            bundle: linux
          - name: macOS 通用版
            os: macos-latest
            command: package:mac
            artifact: release/*.dmg
            bundle: macos

    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 运行测试
        run: npm test

      - name: 类型检查
        run: npm run typecheck

      - name: 构建安装包
        run: npm run ${{ matrix.command }}

      - name: 上传到草稿 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${GITHUB_REF_NAME}"
          ${{ matrix.artifact }}
          --repo "${GITHUB_REPOSITORY}"
          --clobber

  publish:
    name: 发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 发布正式 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release edit "${GITHUB_REF_NAME}"
          --repo "${GITHUB_REPOSITORY}"
          --draft=false
          --latest
